{% load static %}

<!--------------Cart Item Detail----------->
<div class="small container cart-page">
  <table>
    <tbody>
      <tr>
        <th>Product</th>
        <th>Quantity</th>
        <th>Subtotal</th>
      </tr>
      <tr>
        <td>
          <div class="cart-info">
            <img src="{% static 'images/buy-1.jpg' %}" />
            <div>
              <p>Red Printed Tshirt</p>
              <small>Price: $50.00</small>
              <a href="">Remove</a>
            </div>
          </div>
        </td>
        <td><input type="number" value="1" /></td>
        <td>$50.00</td>
      </tr>

      <tr>
        <td>
          <div class="cart-info">
            <img src="{% static 'images/buy-2.jpg' %}" />
            <div>
              <p>Red Printed Tshirt</p>
              <small>Price: $60.00</small>
              <a href="">Remove</a>
            </div>
          </div>
        </td>
        <td><input type="number" value="1" /></td>
        <td>$60.00</td>
      </tr>

      <tr>
        <td>
          <div class="cart-info">
            <img src="{% static 'images/buy-3.jpg' %}" />
            <div>
              <p>Red Printed Tshirt</p>
              <small>Price: $75.00</small>
              <a href="">Remove</a>
            </div>
          </div>
        </td>
        <td><input type="number" value="1" /></td>
        <td>$75.00</td>
      </tr>
    </tbody>
  </table>

  <div class="total-price">
    <table>
      <tbody>
        <tr>
          <td>Subtotal</td>
          <td>$200.00</td>
        </tr>
        <tr>
          <td>Tax</td>
          <td>$30.00</td>
        </tr>
        <tr>
          <td>Total</td>
          <td>$230.00</td>
        </tr>
        <tr>
            <td colspan="2"></td>
            <td><button type="Submit" class="btns">Confirm</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
